[package]
name = "tes-mobile"
version = "0.1.0"
description = "Two-edged Sword for iPhone and Android"
authors = ["Wayne Davies"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "tes_mobile_lib"
# staticlib for iOS, cdylib for Android, rlib for the desktop build used in development.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same SQLite as the desktop app: the module readers are shared with it (src/lib.rs).
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Downloading modules (lib.rs): plain blocking HTTPS with rustls (the pager app's lesson: Android has no
# OpenSSL for native-tls), gunzipped and checked as they arrive.
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
# Native bits the web view can't do (plugins/tes-native): turning with the phone while a picture is open.
tauri-plugin-tes-native = { path = "../plugins/tes-native" }
# The daily reminder: local notifications scheduled a week ahead (lib.rs schedule_reminders).
tauri-plugin-notification = "2"
time = "0.3"
sha2 = "0.10"
# Sync's encryption (sync_crypto.rs, shared with the phone app): SPAKE2 pairing with the code, then
# AES-GCM with a key derived by HKDF.
spake2 = "0.4"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
base64 = "0.22"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
# Not "abort": wry catches WKWebView's exception when it answers a request the web view has already
# dropped (after iOS stops the page in the background), and that catch only works if it can unwind
# through Rust frames. With abort, the app closed as it came back to the front.
panic = "unwind"
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.libsqlite3-sys]
opt-level = 3
