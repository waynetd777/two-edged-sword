<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch and home indicator, and pad by the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Two-edged Sword</title>
  </head>
  <body>
    <!-- The opening screen, as the iOS launch screen draws it (LaunchScreen.storyboard), until the app has
         drawn; main.tsx fades it out. Inline so it shows before any script runs. -->
    <div id="splash" style="position: fixed; inset: 0; z-index: 100; background: #1b2532; transition: opacity 0.3s">
      <img src="/splash-icon.png" alt="" style="position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -90px 0 0 -60px" />
      <div style="position: absolute; left: 0; right: 0; top: 50%; margin-top: 50px; text-align: center; font: 28px Georgia, 'EB Garamond', serif; color: #e3c27a">Two-edged Sword</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
