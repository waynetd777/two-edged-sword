<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch and home indicator, and pad by the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Two-edged Sword</title>
  </head>
  <body>
    <!-- The opening screen, as the launch screen draws it (LaunchScreen.storyboard, Android's cover), until the
         app has drawn; main.tsx fades it out. The desktop's logo and Hebrews 4:12 at the centre of the navy, 320 by 232
         (tools/make_splash_logo.py). Inline so it shows before any script runs. -->
    <div id="splash" style="position: fixed; inset: 0; z-index: 100; background: #1b2532; transition: opacity 0.3s">
      <img src="/splash-logo.png" alt="Two-edged Sword. For the word of God is quick, and powerful, and sharper than any twoedged sword. Hebrews 4:12" style="position: absolute; left: 50%; top: 50%; width: 320px; height: 232px; margin: -116px 0 0 -160px" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
