# The Windows installer for each release make release publishes from the Mac: built from the
# release's commit, signed with the updater key, and added to the release with its entry in
# latest.json (tools/update_windows.py), so installed Windows copies update themselves.
name: Windows release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to add the Windows installer to (v1.0.33)"
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # The crates compiled by windows-cache.yml on main; nothing saved from a tag.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # The built-in modules, built on the Mac by make release and attached to the release: the same files the
      # Mac's app has, and nothing to build here (core's --if-missing then finds them all and only checks).
      - run: |
          gh release download "$env:TAG" -p Two-edged-Sword-modules.zip -D "$env:RUNNER_TEMP"
          tar -xf "$env:RUNNER_TEMP\Two-edged-Sword-modules.zip" -C src-tauri/modules
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build
      - run: python tools/update_windows.py "$env:TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
