# The Windows installer for each release make release publishes from the Mac: built from the
# release's commit, signed with the updater key, and added to the release with its entry in
# latest.json (tools/update_windows.py), so installed Windows copies update themselves.
name: Windows release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to add the Windows installer to (v1.0.33)"
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # The built-in modules, and the downloads they're built from, kept between releases.
      - uses: actions/cache@v5
        with:
          path: |
            src-tauri/modules
            ~\AppData\Local\Two-edged Sword\Caches
          key: modules-${{ hashFiles('tools/core/build.py', 'tools/modules.py') }}
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build
      - run: python tools/update_windows.py "$env:TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
