# The Rust tests and the TypeScript check on Windows, where only the tests build (lib.rs).
name: Windows tests
on:
  push:
    branches: [main]
    paths: ["src-tauri/**", "src/**", "package*.json", "tsconfig*.json", ".github/workflows/windows-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: cargo test --lib
        working-directory: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.json
