# The Windows release build done on main, so windows-release.yml starts with its crates compiled
# and the built-in modules built. A cache saved on a release's tag is seen only by that tag, so each
# release would otherwise build everything again; one saved on main is seen by every tag. The
# caches' paths, keys and shared-key must stay exactly as windows-release.yml has them.
name: Windows release cache
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package*.json"
      - "tools/core/**"
      - "tools/modules.py"
      - "tools/books.py"
      - ".github/workflows/windows-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cache
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/cache@v5
        with:
          path: |
            src-tauri/modules
            ~\AppData\Local\Two-edged Sword\Caches
          key: modules-${{ hashFiles('tools/core/build.py', 'tools/modules.py', 'tools/books.py') }}
      - run: npm ci --no-audit --no-fund
      # The release's build, without the installer.
      - run: npx tauri build --no-bundle
