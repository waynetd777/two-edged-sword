# The Windows release build done on main, so windows-release.yml starts with its crates compiled. A
# cache saved on a release's tag is seen only by that tag, so each release would otherwise compile
# everything again; one saved on main is seen by every tag. The shared-key must stay as
# windows-release.yml has it. The built-in modules aren't built here: the release takes the Mac's.
name: Windows release cache
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package*.json"
      - ".github/workflows/windows-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cache
  cancel-in-progress: true

jobs:
  build:
    # Not for a push that is only make release's version bump ("Two-edged Sword 1.0.37"): the
    # release builds that itself, and nothing the cache holds has changed.
    if: github.event_name != 'push' || github.event.commits[1] != null || !startsWith(github.event.head_commit.message, 'Two-edged Sword 1.')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The release's build, without the installer, and without the built-in modules: the release takes
      # those from the Mac's build (make release attaches them), so only the crates are cached here.
      - run: npx tauri build --no-bundle --config src-tauri/tauri.no-modules.conf.json
