# The Windows release build done on main, so windows-release.yml starts with its crates compiled
# and the built-in modules built. A cache saved on a release's tag is seen only by that tag, so each
# release would otherwise build everything again; one saved on main is seen by every tag. The
# caches' paths, keys and shared-key must stay exactly as windows-release.yml has them.
name: Windows release cache
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package*.json"
      - "tools/**"
      - ".github/workflows/windows-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cache
  cancel-in-progress: true

jobs:
  build:
    # Not for a push that is only make release's version bump ("Two-edged Sword 1.0.37"): the
    # release builds that itself, and nothing the cache holds has changed.
    if: github.event_name != 'push' || github.event.commits[1] != null || !startsWith(github.event.head_commit.message, 'Two-edged Sword 1.')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # The map builder's (tools/maps): the rest of the module builders need only Python itself.
      - run: python -m pip install --disable-pip-version-check numpy pillow
      - uses: actions/cache@v6
        with:
          path: |
            src-tauri/modules
            ~\AppData\Local\Two-edged Sword\Caches
            !src-tauri/modules/maps.refi
            !~\AppData\Local\Two-edged Sword\Caches\maps
          key: modules-${{ hashFiles('tools/**/*.py', '!tools/maps/**') }}
      # The map book on its own, with the terrain it's drawn from: redrawn only when its builder changes,
      # not with every other module (core's --if-missing skips it when it's here).
      - uses: actions/cache@v6
        with:
          path: |
            src-tauri/modules/maps.refi
            ~\AppData\Local\Two-edged Sword\Caches\maps
          key: maps-${{ hashFiles('tools/maps/**') }}
      - run: npm ci --no-audit --no-fund
      # The release's build, without the installer.
      - run: npx tauri build --no-bundle
