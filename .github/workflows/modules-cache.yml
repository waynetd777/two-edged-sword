# The built-in modules, built on main whenever what builds them changes, for the Windows release
# to take from the cache. A cache saved on a release's tag is seen only by that tag, so each release
# would otherwise build them all again; one saved on main is seen by every tag. The path and key
# must stay exactly as windows-release.yml has them.
name: Modules cache
on:
  push:
    branches: [main]
    paths: ["tools/core/**", "tools/modules.py", "tools/books.py", ".github/workflows/modules-cache.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - id: cache
        uses: actions/cache@v5
        with:
          path: |
            src-tauri/modules
            ~\AppData\Local\Two-edged Sword\Caches
          key: modules-${{ hashFiles('tools/core/build.py', 'tools/modules.py', 'tools/books.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: python tools/core/build.py --if-missing
