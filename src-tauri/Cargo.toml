[package]
name = "two-edged-sword"
version = "1.2.4"
description = "A Bible study app for macOS and Windows that reads modules in e-Sword X's formats"
authors = ["Wayne Davies"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "two_edged_sword_lib"
# rlib only: each extra crate type is another full LTO link.
crate-type = ["rlib"]

# The binary name is what the Dock and Activity Monitor show in `tauri dev`.
[[bin]]
name = "TwoEdgedSword"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# One copy of the app at a time (lib.rs).
tauri-plugin-single-instance = "2"
# Ask ends a CLI and everything it started by signalling its process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the music files' tags (music_files.rs); spelling from Windows' spell checker and
# grammar from Harper, which runs on the PC (spell_win.rs); the media controls (media_win.rs),
# Open at Login (login_win.rs) and keeping the display awake.
[target.'cfg(windows)'.dependencies]
lofty = "0.25"
harper-core = { version = "2", default-features = false, features = ["concurrent"] }
windows = { version = "0.62", features = ["Foundation", "Media", "Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_Power", "Win32_System_Registry", "Win32_System_WinRT"] }
# Export as PDF through WebView2's PrintToPdf (pdf.rs), at tauri's own versions; the paper size
# from the user's locale.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

# AppKit and the rest: the app is macOS only. Elsewhere only the tests are built (lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSValue", "NSArray", "NSRange", "NSDictionary", "NSURL", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSSpellChecker", "NSWindow", "NSResponder", "NSAppearance", "NSCursor", "NSPrintInfo", "NSPrintOperation", "NSView"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVSpeechSynthesis"] }

# Thin LTO with parallel codegen units: incremental release builds in ~20s instead of minutes.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# `make dev` and `make check` rebuild constantly; debug info for every dependency is most of
# the link time and nobody steps through them in a debugger here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# SQLite does all the searching; unoptimised it is several times slower even in dev builds.
# It is compiled once and cached, so this costs nothing per rebuild.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
